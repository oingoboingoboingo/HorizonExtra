name: Build Windows (modded)

# Manual only: Actions tab -> "Build Windows (modded)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install node-gyp
        run: npm install --global node-gyp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (webpack, production)
        shell: bash
        working-directory: electron
        run: |
          mkdir -p dist
          pnpm run webpack:prod

      - name: Package Windows portable .exe (no install needed)
        shell: bash
        working-directory: electron
        run: node build/build.mjs --os windows --format portable --arch x64 --no-docker

      - name: Package Windows installer (optional)
        continue-on-error: true
        shell: bash
        working-directory: electron
        run: node build/build.mjs --os windows --format nsis --arch x64 --no-docker

      - name: Upload .exe files
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-modded-windows
          path: |
            electron/dist/*.exe
          if-no-files-found: error
